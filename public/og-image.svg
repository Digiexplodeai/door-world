  </radialGradient>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Subtle Copper Accent Borders -->
  <rect x="40" y="40" width="1120" height="550" rx="12" fill="none" stroke="#B8793A" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Logo Mark -->
  <g transform="translate(120, 110)">
    <!-- Base D Shape -->
    <path d="M0 0 H80 C120 0 150 30 150 72 C150 114 120 144 80 144 H0 Z" fill="#171412" stroke="#B8793A" stroke-width="3"/>
    <circle cx="80" cy="72" r="54" fill="none" stroke="#2A241F" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M48 30 L96 18 L96 126 L48 114 Z" fill="#B8793A" stroke="#F7F3EC" stroke-width="2.5"/>
    <circle cx="88" cy="72" r="3" fill="#F7F3EC"/>

    <g transform="translate(180, 20)">
