      <text x="20" y="32" font-family="'Outfit', -apple-system, sans-serif" font-weight="600" font-size="16" fill="#B8793A">CALL / WHATSAPP:</text>
      <text x="195" y="32" font-family="'Outfit', -apple-system, sans-serif" font-weight="600" font-size="16" fill="#F7F3EC">98120 05418 / 0172-2912765</text>
